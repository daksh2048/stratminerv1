# ============================================================
# ES Futures — 10 Year Backtest
# ONE timeframe only: 15min for most, 5min for ORB
# ============================================================
engine:
  timeframes: ["15min"]        # Single TF — ORB uses 5min via its own parquet load
  period:     "10y"
  symbols:    [ES]
  exchange:   "futures"

  paper_balance:   50000.0
  risk_per_trade:  0.005        # 0.5% risk per trade
  slippage_bps:    2.0
  max_loss_pct:    0.50

  warmup_bars:  100
  context_bars: 500

  strategies_to_run:
    - swing_bos          # ✅ positive on 15min — HTF fixed
    - orb                # ✅ 5min only (15min produces 0 trades by design)
    - vwap_rejection     # ✅ intraday MR — works on 15min
    - vwap_momentum      # ✅ intraday trend — works on 15min
    - bollinger_squeeze  # ⚠️  tested on 5min only; may be sparse on 15min
    - rsi_mean_reversion # ✅ intraday MR — works on 15min
    - rsi_extremes_reversal  # new variant

  # EXCLUDED — net losers on ES:
  # gap_fill:   volume filter blocks all entries (RTH vol vs overnight baseline mismatch)
  # ma_crossover: lost 50% capital — 5min MA cross is noise on a trending instrument
  # sr_breakout:  lost 50% capital — stock-style S/R breaks constantly on rollover/trend days

logging:
  out_dir: "backtests/es_10y"

# ============================================================
# Strategy configs — ES-tuned
# ============================================================
strategies:

  swing_bos:
    market_tz:                America/New_York
    rth_open:                 "09:30"
    rth_close:                "16:00"
    exchange:                 futures          # tells strategy to use parquet for HTF
    min_minutes_after_open:   60
    entry_cutoff_minutes:     300
    max_trades_per_day:       3
    htf_timeframe:            1d
    htf_period:               "10y"
    htf_ema_period:           20
    swing_window:             5
    atr_period:               14
    stop_atr_mult:            1.0
    min_atr:                  3.0
    use_retest:               true
    retest_max_bars:          20
    retest_tolerance_atr:     0.5
    use_volume_filter:        true
    volume_ema_period:        20
    volume_mult:              1.2
    partial_take_pct:         0.5
    partial_take_rr:          1.5
    risk_reward:              3.0
    runner_take_mode:         rr
    max_bars_open:            78
    trail_mode:               tiered
    trail_activate_after_partial: true
    trail_pct:                0.02
    trail_atr_mult:           2.0
    trail_lookback:           10
    trail_tier1_pct:          0.04
    trail_tier2_pct:          0.02
    trail_tier3_pct:          0.01
    trail_swing_window:       5
    trail_buffer_mult:        0.3
    trail_initial_pct:        0.03
    trail_acceleration:       0.0005
    trail_min_pct:            0.01

  orb:
